<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js Engine — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #11131a; }
    #app { width: 100vw; height: 100vh; }
    .hud {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      color: #aab; font-size: 13px; line-height: 1.7;
      background: rgba(17, 19, 26, 0.75); border: 1px solid #2a2a3a;
      border-radius: 10px; padding: 12px 16px; user-select: none;
    }
    .hud b { color: #fff; }
    .hud .fps { color: #6cffb8; }
    .hud code { color: #6c8cff; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div><b>Three.js Engine</b> — <span class="fps" id="fps">--</span> fps</div>
    <div>Drag to orbit · scroll to zoom · right-drag to pan</div>
    <div>Click an object to select it (see console)</div>
    <div>API: <code>new Engine('#app')</code> → <code>engine.addBox(...)</code></div>
  </div>

  <script type="module">
    import Engine from './src/engine.js';

    const engine = new Engine('#app');

    engine.addPlane('floor', { size: [40, 40], color: 0x22222f });
    engine.addBox('crate', { size: [1.5, 1.5, 1.5], position: [-2.5, 0.75, 0], color: 0x6c8cff });
    engine.addSphere('orb', { radius: 1, position: [0, 1, 0], spin: true });
    engine.addTorus('ring', { position: [3, 1.2, 0], spin: true });
    engine.addCone('spike', { position: [0.5, 0.8, -2.5] });

    engine.onUpdate((dt, t) => {
      const orb = engine.get('orb');
      if (orb) orb.position.y = 1 + Math.sin(t * 1.5) * 0.4;
    });

    engine.onPick = (hit) => {
      console.log('Picked:', hit ? hit.object.name || hit.object.type : 'nothing', hit);
    };

    engine.onHover = (hit) => {
      document.body.style.cursor = hit ? 'pointer' : 'default';
    };

    const fpsEl = document.getElementById('fps');
    setInterval(() => { fpsEl.textContent = engine.fps; }, 500);

    window.engine = engine;
  </script>
</body>
</html>
